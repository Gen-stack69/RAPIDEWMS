<script>
/* --------- RAPIDÉWMS WebSocket Sync --------- */
const socket = new WebSocket('wss://blink-located-equal-wing.trycloudflare.com');

socket.onopen = () => {
  console.log('Connected to local WebSocket server!');
  
  // Keep connection alive every 20 seconds
  setInterval(() => {
    if (socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'ping' }));
    }
  }, 20000);
};

socket.onmessage = (event) => {
  console.log('Message received:', event.data);
  if (event.data.includes('ping')) return;

  try {
    const payload = JSON.parse(event.data);
    if (payload.type === 'wms_sync' && payload.data) {
      db = payload.data;
      localStorage.wms = JSON.stringify(db);
      if (typeof draw === 'function') draw();
    }
  } catch (e) {
    console.error('Sync error:', e);
  }
};

function sendData(payload) {
  if (socket.readyState === WebSocket.OPEN) {
    socket.send(typeof payload === 'object' ? JSON.stringify(payload) : payload);
  }
}
</script>
